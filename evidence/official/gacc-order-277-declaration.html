                <li><a href="javascript:;">2018年12月进出口商品境内目的地／货</a></li>
            </ul>
        </div>

    <script>
        var hdtit = sessionStorage.getItem('idtext')
        document.getElementById("hdtit").innerHTML = hdtit;
        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
            var r = window.location.search.substr(1).match(reg);  //匹配目标参数
            if (r != null) return unescape(r[2]); return null; //返回参数值
        };
        //接收URL中的参数
        var Id = getUrlParam('id');
        // var shortTimeURL = 'https://fdi.mofcom.gov.cn/cipa-api';
        $.ajax({
            type: 'GET',
            dataType: 'json',
            async: false,
            contentType: 'application/json;charset=UTF-8',
            url: shortTimeURL + '/laws/web/get?id=' + Id,
            success: function (data) {
                var jsonData = data.data;
                // console.log(jsonData.content)
                var str = '';
                str += '<h2 class="text-center">' + jsonData.name + '</h2>';
                str += '<div class="moreInfo text-center">';
                if (jsonData.resource == undefined || jsonData.resource == '') {
                    console.log('空值');
                } else {
                    str += '<span class="source">' + jsonData.resource + '</span>'
                }
                if (jsonData.issueNum === undefined || jsonData.issueNum === null) { } else {
                    str += '<span class="source" style="margin-right:20px;">' + jsonData.issueNum + '</span>'
                }
                str += '<span class="time">' + jsonData.issueDate + '</span>'
                //添加中英文对照
                if (jsonData.hasOwnProperty("relatedId")) {
                    str += '<span style="padding-left:15px;"><a href="/EN/come-falvfagui-con.html?id=' + jsonData.relatedId + '" target="_blank"><font color="#e61a1a"><strong>[英&nbsp;文]</strong></font></a></span>'
                }
                str += '</div>';
                // 上面是判断来源
                // 判断
                if (jsonData.content == undefined || jsonData.content == '') {
                    var url = jsonData.accessoryUrl.split(',');
                    url.forEach(function(element){
                        if (element.indexOf("pdf") != -1) {
                            str+='<embed id="iframe" style="width:100%;height:800px;" src="'+element+'"></embed>';
                        }
                    });
                } else {
                    str += jsonData.content;
                };
                $('#content').append(str);
                // var pdfh5 = new Pdfh5('#iframe', { pdfurl: jsonData.accessoryUrl });
                // 假如附件是空或者没有定义
                if (jsonData.accessoryUrl == undefined || jsonData.accessoryUrl == '') {
                    console.log('没有附件')
                } else {
                    var downHtml = '';
                    downHtml += '<dl class="downloadBox" style="text-align:left">';
                    downHtml += '<dt>附件列表(点击下载):</dt>'
                    var dataObj = JSON.parse(jsonData.accessory)
                    console.log('11111',dataObj)
                    $.each(dataObj, function (i, obj) {
                        downHtml += '<dd>附件名称：<a href="' + obj.url + '" download="' + obj.name + '" title="' + obj.name + '" >' + obj.name.substring(0, 30) + '</a></dd>'
                    })
                    downHtml += '</dl>';
                    $('.pg-left').append(downHtml)
                }
            }
        })
        $.ajax({
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json;charset=UTF-8',
            url: shortTimeURL + '/statistics/web/list',
            data: JSON.stringify({
                menuId: 1,
                page: 1
                // 输入关键字
            }),
            success: function (data) {
                var str = ''
                var jsonData = data.data;
                $.each(jsonData, function (i, obj) {
                    str += '<li>';
                    str += '<a href="come-datatongji-con.html?id=' + obj.id + '">' + obj.name + '</a>';
                    str += '</li>';
                })
                $('.new-list2:first-child').append(str);
            }
        });
    </script>
    <div id="footer"></div>
</body>
<script>
    $('#header').load('come-head.html');

    $('#content p').each(function () {
        var number = $(this).children().length;
        if (number == 0) {
            $(this).html($(this).html().replace(/\s+/g, ''))
            $(this).html($(this).html().replace(/&nbsp;/ig, ''))
        }
    })
</script>
